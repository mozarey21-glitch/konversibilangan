<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Explorer - Petualangan Konversi Bilangan</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #2d1b69 100%);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .game-container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }

        .title {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #00ffff;
            margin-bottom: 20px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff00;
        }

        .level-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .level-card {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .level-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
            border-color: #00ffff;
        }

        .level-card.completed {
            background: linear-gradient(135deg, rgba(0, 255, 0, 0.2), rgba(255, 255, 0, 0.1));
            border-color: #00ff00;
        }

        .level-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            background: rgba(100, 100, 100, 0.1);
        }

        .level-number {
            font-size: 2rem;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 10px;
        }

        .level-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .level-description {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 15px;
        }

        .level-theme {
            font-size: 0.8rem;
            color: #ff00ff;
            font-style: italic;
        }

        .game-area {
            display: none;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .current-level {
            font-size: 1.5rem;
            color: #00ffff;
        }

        .level-progress {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 20px;
            width: 200px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #ffff00);
            width: 0%;
            transition: width 0.5s ease;
        }

        .question-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #fff;
        }

        .number-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00ffff;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border: 2px solid rgba(0, 255, 255, 0.5);
        }

        .input-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .answer-input {
            font-size: 1.5rem;
            padding: 15px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            text-align: center;
            width: 200px;
        }

        .answer-input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .submit-btn {
            font-size: 1.2rem;
            padding: 15px 30px;
            background: linear-gradient(45deg, #00ff00, #00ffff);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);
        }

        .feedback {
            text-align: center;
            font-size: 1.2rem;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .feedback.correct {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            border: 2px solid #00ff00;
        }

        .feedback.incorrect {
            background: rgba(255, 0, 0, 0.2);
            color: #ff0000;
            border: 2px solid #ff0000;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .control-btn {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            pointer-events: none;
            animation: particle-float 3s linear infinite;
        }

        @keyframes particle-float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .achievement {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(45deg, #ffd700, #ffff00);
            color: #000;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 1000;
            display: none;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .level-selector {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
            }
            
            .number-display {
                font-size: 2rem;
            }
            
            .answer-input {
                width: 150px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="game-container">
        <div class="header">
            <h1 class="title">🚀 DIGITAL EXPLORER 🚀</h1>
            <p class="subtitle">Petualangan Konversi Bilangan di Dunia Digital</p>
            
            <div class="score-board">
                <div class="score-item">
                    <div class="score-label">Total Skor</div>
                    <div class="score-value" id="totalScore">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Level Selesai</div>
                    <div class="score-value" id="completedLevels">0/10</div>
                </div>
                <div class="score-item">
                    <div class="score-label">Akurasi</div>
                    <div class="score-value" id="accuracy">100%</div>
                </div>
            </div>
        </div>

        <div class="level-selector" id="levelSelector">
            <!-- Level cards will be generated here -->
        </div>

        <div class="game-area" id="gameArea">
            <div class="game-header">
                <div class="current-level" id="currentLevelDisplay">Level 1</div>
                <div class="level-progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <div class="question-area">
                <div class="question-text" id="questionText">Konversi bilangan berikut:</div>
                <div class="number-display" id="numberDisplay">1010</div>
                <div id="conversionHint" style="color: #ffff00; margin-top: 10px;"></div>
            </div>

            <div class="input-area">
                <input type="text" class="answer-input" id="answerInput" placeholder="Jawaban Anda">
                <button class="submit-btn" id="submitBtn">Submit</button>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="controls">
                <button class="control-btn" id="hintBtn">💡 Petunjuk</button>
                <button class="control-btn" id="backBtn">🏠 Kembali</button>
                <button class="control-btn" id="nextBtn" style="display: none;">➡️ Lanjut</button>
            </div>
        </div>
    </div>

    <div class="achievement" id="achievement">
        <div>🎉 LEVEL SELESAI! 🎉</div>
        <div style="font-size: 1rem; margin-top: 10px;">+10 Poin!</div>
    </div>

    <script>
        class DigitalExplorer {
            constructor() {
                this.currentLevel = 1;
                this.currentQuestion = 0;
                this.score = 0;
                this.completedLevels = 0;
                this.totalQuestions = 0;
                this.correctAnswers = 0;
                this.questionsPerLevel = 5;
                
                this.levels = [
                    {
                        id: 1,
                        title: "Hutan Data Biner",
                        description: "Konversi Biner → Desimal",
                        theme: "🌲 Jelajahi hutan data mistis",
                        type: "bin_to_dec",
                        difficulty: "easy"
                    },
                    {
                        id: 2,
                        title: "Danau Digital",
                        description: "Konversi Desimal → Biner",
                        theme: "🏞️ Seberangi danau digital",
                        type: "dec_to_bin",
                        difficulty: "easy"
                    },
                    {
                        id: 3,
                        title: "Gua Angka Gelap",
                        description: "Biner → Desimal (Lanjutan)",
                        theme: "🕳️ Tembus gua angka gelap",
                        type: "bin_to_dec",
                        difficulty: "medium"
                    },
                    {
                        id: 4,
                        title: "Jembatan Kode",
                        description: "Desimal → Biner (Lanjutan)",
                        theme: "🌉 Lewati jembatan kode",
                        type: "dec_to_bin",
                        difficulty: "medium"
                    },
                    {
                        id: 5,
                        title: "Menara Oktal",
                        description: "Desimal → Oktal",
                        theme: "🗼 Naiki menara oktal tinggi",
                        type: "dec_to_oct",
                        difficulty: "medium"
                    },
                    {
                        id: 6,
                        title: "Labirin Oktal",
                        description: "Oktal → Desimal",
                        theme: "🌀 Keluar dari labirin oktal",
                        type: "oct_to_dec",
                        difficulty: "medium"
                    },
                    {
                        id: 7,
                        title: "Kastil Heksadesimal",
                        description: "Desimal → Heksadesimal",
                        theme: "🏰 Taklukkan kastil hex",
                        type: "dec_to_hex",
                        difficulty: "hard"
                    },
                    {
                        id: 8,
                        title: "Portal Hex Cahaya",
                        description: "Heksadesimal → Desimal",
                        theme: "✨ Masuki portal hex cahaya",
                        type: "hex_to_dec",
                        difficulty: "hard"
                    },
                    {
                        id: 9,
                        title: "Dimensi Campuran",
                        description: "Konversi Multi-Basis",
                        theme: "🌌 Jelajahi dimensi campuran",
                        type: "mixed",
                        difficulty: "expert"
                    },
                    {
                        id: 10,
                        title: "Puncak Digital",
                        description: "Master Konversi",
                        theme: "⛰️ Capai puncak digital",
                        type: "master",
                        difficulty: "expert"
                    }
                ];

                this.init();
            }

            init() {
                this.createStars();
                this.renderLevelSelector();
                this.bindEvents();
                this.updateScoreBoard();
            }

            createStars() {
                const starsContainer = document.getElementById('stars');
                for (let i = 0; i < 100; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 2 + 's';
                    starsContainer.appendChild(star);
                }
            }

            renderLevelSelector() {
                const container = document.getElementById('levelSelector');
                container.innerHTML = '';

                this.levels.forEach(level => {
                    const card = document.createElement('div');
                    card.className = `level-card ${this.completedLevels >= level.id ? 'completed' : ''} ${this.completedLevels < level.id - 1 ? 'locked' : ''}`;
                    
                    card.innerHTML = `
                        <div class="level-number">Level ${level.id}</div>
                        <div class="level-title">${level.title}</div>
                        <div class="level-description">${level.description}</div>
                        <div class="level-theme">${level.theme}</div>
                    `;

                    if (this.completedLevels >= level.id - 1) {
                        card.addEventListener('click', () => this.startLevel(level.id));
                    }

                    container.appendChild(card);
                });
            }

            startLevel(levelId) {
                this.currentLevel = levelId;
                this.currentQuestion = 0;
                document.getElementById('levelSelector').style.display = 'none';
                document.getElementById('gameArea').style.display = 'block';
                document.getElementById('currentLevelDisplay').textContent = `Level ${levelId} - ${this.levels[levelId - 1].title}`;
                this.generateQuestion();
            }

            generateQuestion() {
                const level = this.levels[this.currentLevel - 1];
                const questionText = document.getElementById('questionText');
                const numberDisplay = document.getElementById('numberDisplay');
                const hintDiv = document.getElementById('conversionHint');
                
                let question, answer, hint;

                switch (level.type) {
                    case 'bin_to_dec':
                        if (level.difficulty === 'easy') {
                            question = this.generateBinary(4);
                        } else {
                            question = this.generateBinary(8);
                        }
                        answer = parseInt(question, 2);
                        questionText.textContent = `Konversi bilangan biner berikut ke desimal:`;
                        hint = `Petunjuk: Hitung dari kanan ke kiri dengan pangkat 2`;
                        break;

                    case 'dec_to_bin':
                        if (level.difficulty === 'easy') {
                            question = Math.floor(Math.random() * 16) + 1;
                        } else {
                            question = Math.floor(Math.random() * 128) + 1;
                        }
                        answer = question.toString(2);
                        questionText.textContent = `Konversi bilangan desimal berikut ke biner:`;
                        hint = `Petunjuk: Bagi dengan 2 berulang kali, ambil sisa bagi`;
                        break;

                    case 'dec_to_oct':
                        question = Math.floor(Math.random() * 64) + 1;
                        answer = question.toString(8);
                        questionText.textContent = `Konversi bilangan desimal berikut ke oktal:`;
                        hint = `Petunjuk: Bagi dengan 8 berulang kali, ambil sisa bagi`;
                        break;

                    case 'oct_to_dec':
                        question = this.generateOctal();
                        answer = parseInt(question, 8);
                        questionText.textContent = `Konversi bilangan oktal berikut ke desimal:`;
                        hint = `Petunjuk: Hitung dari kanan ke kiri dengan pangkat 8`;
                        break;

                    case 'dec_to_hex':
                        question = Math.floor(Math.random() * 256) + 1;
                        answer = question.toString(16).toUpperCase();
                        questionText.textContent = `Konversi bilangan desimal berikut ke heksadesimal:`;
                        hint = `Petunjuk: Bagi dengan 16, gunakan A-F untuk 10-15`;
                        break;

                    case 'hex_to_dec':
                        question = this.generateHex();
                        answer = parseInt(question, 16);
                        questionText.textContent = `Konversi bilangan heksadesimal berikut ke desimal:`;
                        hint = `Petunjuk: A=10, B=11, C=12, D=13, E=14, F=15`;
                        break;

                    case 'mixed':
                    case 'master':
                        const types = ['bin_to_dec', 'dec_to_bin', 'dec_to_oct', 'oct_to_dec', 'dec_to_hex', 'hex_to_dec'];
                        const randomType = types[Math.floor(Math.random() * types.length)];
                        return this.generateMixedQuestion(randomType);
                }

                numberDisplay.textContent = question;
                hintDiv.textContent = hint;
                this.currentAnswer = answer.toString();
                
                document.getElementById('answerInput').value = '';
                document.getElementById('feedback').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                
                this.updateProgress();
            }

            generateMixedQuestion(type) {
                const level = this.levels[this.currentLevel - 1];
                const questionText = document.getElementById('questionText');
                const numberDisplay = document.getElementById('numberDisplay');
                const hintDiv = document.getElementById('conversionHint');
                
                let question, answer, hint;

                switch (type) {
                    case 'bin_to_dec':
                        question = this.generateBinary(6);
                        answer = parseInt(question, 2);
                        questionText.textContent = `Konversi biner ke desimal:`;
                        hint = `Petunjuk: Gunakan pangkat 2`;
                        break;
                    case 'dec_to_bin':
                        question = Math.floor(Math.random() * 100) + 1;
                        answer = question.toString(2);
                        questionText.textContent = `Konversi desimal ke biner:`;
                        hint = `Petunjuk: Bagi dengan 2`;
                        break;
                    case 'dec_to_oct':
                        question = Math.floor(Math.random() * 100) + 1;
                        answer = question.toString(8);
                        questionText.textContent = `Konversi desimal ke oktal:`;
                        hint = `Petunjuk: Bagi dengan 8`;
                        break;
                    case 'oct_to_dec':
                        question = this.generateOctal();
                        answer = parseInt(question, 8);
                        questionText.textContent = `Konversi oktal ke desimal:`;
                        hint = `Petunjuk: Gunakan pangkat 8`;
                        break;
                    case 'dec_to_hex':
                        question = Math.floor(Math.random() * 200) + 1;
                        answer = question.toString(16).toUpperCase();
                        questionText.textContent = `Konversi desimal ke heksadesimal:`;
                        hint = `Petunjuk: Bagi dengan 16`;
                        break;
                    case 'hex_to_dec':
                        question = this.generateHex();
                        answer = parseInt(question, 16);
                        questionText.textContent = `Konversi heksadesimal ke desimal:`;
                        hint = `Petunjuk: A=10, B=11, dst.`;
                        break;
                }

                numberDisplay.textContent = question;
                hintDiv.textContent = hint;
                this.currentAnswer = answer.toString();
                
                document.getElementById('answerInput').value = '';
                document.getElementById('feedback').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'none';
                
                this.updateProgress();
            }

            generateBinary(length) {
                let binary = '';
                for (let i = 0; i < length; i++) {
                    binary += Math.floor(Math.random() * 2);
                }
                return binary;
            }

            generateOctal() {
                const length = Math.floor(Math.random() * 2) + 2;
                let octal = '';
                for (let i = 0; i < length; i++) {
                    octal += Math.floor(Math.random() * 8);
                }
                return octal;
            }

            generateHex() {
                const length = Math.floor(Math.random() * 2) + 2;
                const hexChars = '0123456789ABCDEF';
                let hex = '';
                for (let i = 0; i < length; i++) {
                    hex += hexChars[Math.floor(Math.random() * 16)];
                }
                return hex;
            }

            checkAnswer() {
                const userAnswer = document.getElementById('answerInput').value.trim().toUpperCase();
                const feedback = document.getElementById('feedback');
                
                this.totalQuestions++;

                if (userAnswer === this.currentAnswer.toUpperCase()) {
                    feedback.textContent = '🎉 Benar! Jawaban Anda tepat!';
                    feedback.className = 'feedback correct';
                    feedback.style.display = 'block';
                    
                    this.score += 10;
                    this.correctAnswers++;
                    this.createParticles();
                    
                    this.currentQuestion++;
                    
                    if (this.currentQuestion >= this.questionsPerLevel) {
                        this.completeLevel();
                    } else {
                        document.getElementById('nextBtn').style.display = 'inline-block';
                    }
                } else {
                    feedback.textContent = `❌ Salah! Jawaban yang benar adalah: ${this.currentAnswer}`;
                    feedback.className = 'feedback incorrect';
                    feedback.style.display = 'block';
                    
                    setTimeout(() => {
                        this.currentQuestion++;
                        if (this.currentQuestion >= this.questionsPerLevel) {
                            this.completeLevel();
                        } else {
                            this.generateQuestion();
                        }
                    }, 2000);
                }
                
                this.updateScoreBoard();
            }

            completeLevel() {
                this.completedLevels = Math.max(this.completedLevels, this.currentLevel);
                this.showAchievement();
                
                setTimeout(() => {
                    this.backToLevelSelector();
                }, 2000);
            }

            showAchievement() {
                const achievement = document.getElementById('achievement');
                achievement.style.display = 'block';
                
                setTimeout(() => {
                    achievement.style.display = 'none';
                }, 2000);
            }

            createParticles() {
                const gameArea = document.getElementById('gameArea');
                for (let i = 0; i < 10; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.top = Math.random() * 100 + '%';
                    gameArea.appendChild(particle);
                    
                    setTimeout(() => {
                        particle.remove();
                    }, 3000);
                }
            }

            updateProgress() {
                const progress = (this.currentQuestion / this.questionsPerLevel) * 100;
                document.getElementById('progressBar').style.width = progress + '%';
            }

            updateScoreBoard() {
                document.getElementById('totalScore').textContent = this.score;
                document.getElementById('completedLevels').textContent = `${this.completedLevels}/10`;
                
                const accuracy = this.totalQuestions > 0 ? Math.round((this.correctAnswers / this.totalQuestions) * 100) : 100;
                document.getElementById('accuracy').textContent = accuracy + '%';
            }

            showHint() {
                const hintDiv = document.getElementById('conversionHint');
                hintDiv.style.display = hintDiv.style.display === 'none' ? 'block' : 'none';
            }

            nextQuestion() {
                this.generateQuestion();
            }

            backToLevelSelector() {
                document.getElementById('gameArea').style.display = 'none';
                document.getElementById('levelSelector').style.display = 'grid';
                this.renderLevelSelector();
            }

            bindEvents() {
